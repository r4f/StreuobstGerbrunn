<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{WEBSITE_TITLE}}</title>
	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.11.0/dist/maplibre-gl.css" integrity="sha384-mnM9NG1099tBMNxdDQNDKIxYcn/fmqQXFJvbT5l1MsrWvzfxBEffceBsw75/cW2R" crossorigin="anonymous">
	<script src="https://unpkg.com/maplibre-gl@5.11.0/dist/maplibre-gl.js" integrity="sha384-UqLzv/PVLQB7sEV62X3GYMHHoOqGqOb1iE7JdfWsbtK4gYx1Q1VzU3qsx+otdWEa" crossorigin="anonymous"></script>
        <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #map {
                width: 100vw;
                height: 100%;
                max-width: 100%;
                max-height: 100%;
        }
        #search {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 1;
                max-width: calc(100vw - 80px);
                background: #fff;
                border-radius: 4px;
                box-shadow: 0 0 0 2px rgba(0, 0, 0, .1);
                font: 14px/1.4 sans-serif;
                color: #222;
        }
        #search summary {
                padding: 6px 10px;
                cursor: pointer;
                font-weight: bold;
        }
        #search .fields {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 0 10px 10px;
                width: 240px;
                max-width: 100%;
                box-sizing: border-box;
        }
        #search select, #search input, #search button {
                font: inherit;
                padding: 4px;
        }
        #search .buttons {
                display: flex;
                gap: 6px;
        }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <details id="search" open hidden>
            <summary>Baumsuche</summary>
            <div class="fields">
                <label for="search-group">Obstart</label>
                <select id="search-group">
                    <option value="">Alle</option>
                </select>
                <label for="search-cultivar">Sorte</label>
                <input id="search-cultivar" list="search-cultivar-list" type="search" placeholder="z. B. Boskoop" autocomplete="off">
                <datalist id="search-cultivar-list"></datalist>
                <span id="search-result" aria-live="polite"></span>
                <div class="buttons">
                    <button id="search-zoom" type="button" disabled>Zu den Treffern</button>
                    <button id="search-reset" type="button" hidden>Zurücksetzen</button>
                </div>
            </div>
        </details>
        <script src="main.js"></script>
    </body>
</html>
